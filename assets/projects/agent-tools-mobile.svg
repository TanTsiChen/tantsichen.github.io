<svg xmlns="http://www.w3.org/2000/svg" width="600" height="750" viewBox="0 0 600 750" role="img" aria-labelledby="title description">
  <title id="title">Building tools and running agents</title>
  <desc id="description">Tool development and agent execution. An interface, implementation, and tests come together as a callable tool. A sequence diagram shows an agent calling the tool and receiving its result, with vertical lifelines and execution bars indicating the running processes. The build path joins the tool before the call begins. This is a general schematic of agent tooling, independent of any particular plugin or model.</desc>

  <defs>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#526373" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#3e69a0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#367c78" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-plum" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#88638e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#ac7c30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="600" height="750" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif" font-weight="400">
    <text x="300" y="52" font-size="34" fill="#293744" text-anchor="middle" >Build tools</text><g transform="translate(98 116)" ><path d="M-10 -19H-16V-6L-22 0L-16 6V19H-10M10 -19H16V-6L22 0L16 6V19H10" fill="none" stroke="#ac7c30" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" /><path d="M-6 -7H6M-6 7H6" fill="none" stroke="#526373" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(300 116)" ><path d="M-18 -23H8L20 -11V23H-18ZM8 -23V-11H20" fill="none" stroke="#526373" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M-6 -2L-12 4L-6 10M7 -2L13 4L7 10M3 -4L-2 12" fill="none" stroke="#ac7c30" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(502 116)" ><rect x="-20" y="-22" width="40" height="44" rx="2" fill="#fff" stroke="#526373" stroke-width="2"/><path d="M-13 -10L-9 -6L-3 -14M-13 8L-9 12L-3 4" fill="none" stroke="#ac7c30" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M4 -9H12M4 9H12" fill="none" stroke="#526373" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="98" y="179" font-size="30" fill="#293744" text-anchor="middle" >Interface</text><text x="300" y="179" font-size="30" fill="#293744" text-anchor="middle" >Implementation</text><text x="502" y="179" font-size="30" fill="#293744" text-anchor="middle" >Tests</text><path d="M98 201V233H502V201M300 201V255" fill="none" stroke="#cad3da" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M300 255V271H150V332" fill="none" stroke="#ac7c30" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-gold)" /><text x="329" y="315" font-size="34" fill="#293744" text-anchor="middle" >Agent runtime</text><g transform="translate(150 368)" ><rect x="-20" y="-26" width="50" height="36" rx="2" fill="#fff" stroke="#ac7c30" stroke-width="2"/><rect x="-28" y="-18" width="50" height="36" rx="2" fill="#f7f1e5" stroke="#ac7c30" stroke-width="2"/><path d="M-15 -9L-20 0L-15 9M9 -9L14 0L9 9M-1 -10L-6 10" fill="none" stroke="#ac7c30" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" /></g><circle cx="450" cy="368" r="23" fill="#fff" stroke="#293744" stroke-width="2.5"/><path d="M444 358L459 368L444 378Z" fill="none" stroke="#293744" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /><text x="150" y="422" font-size="32" fill="#293744" text-anchor="middle" >Tools</text><text x="450" y="422" font-size="32" fill="#293744" text-anchor="middle" >Agent</text><path d="M150 444V715" fill="none" stroke="#cad3da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 7"/><rect x="141" y="508" width="18" height="86" rx="1" fill="#f7f1e5" stroke="#ac7c30" stroke-width="2"/><path d="M450 444V715" fill="none" stroke="#cad3da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 7"/><rect x="441" y="454" width="18" height="239" rx="1" fill="#f1f3f5" stroke="#526373" stroke-width="2"/><text x="300" y="478" font-size="32" fill="#526373" text-anchor="middle" >Call</text><path d="M438 508H163" fill="none" stroke="#526373" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)" /><path d="M163 594H438" fill="none" stroke="#526373" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)" /><text x="300" y="638" font-size="32" fill="#526373" text-anchor="middle" >Result</text>
  </g>
</svg>
