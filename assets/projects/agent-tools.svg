th="50" height="36" rx="2" fill="#fff" stroke="#ac7c30" stroke-width="2"/><rect x="-28" y="-18" width="50" height="36" rx="2" fill="#f7f1e5" stroke="#ac7c30" stroke-width="2"/><path d="M-15 -9L-20 0L-15 9M9 -9L14 0L9 9M-1 -10L-6 10" fill="none" stroke="#ac7c30" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" /></g><circle cx="875" cy="166" r="23" fill="#fff" stroke="#293744" stroke-width="2.5"/><path d="M869 156L884 166L869 176Z" fill="none" stroke="#293744" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /><path d="M535 204V401" fill="none" stroke="#cad3da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 7"/><rect x="526" y="238" width="18" height="86" rx="1" fill="#f7f1e5" stroke="#ac7c30" stroke-width="2"/><path d="M875 204V401" fill="none" stroke="#cad3da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 7"/><rect x="866" y="209" width="18" height="170" rx="1" fill="#f1f3f5" stroke="#526373" stroke-width="2"/><text x="705" y="210" font-size="30" fill="#526373" text-anchor="middle" >Call</text><path d="M863 238H548" fill="none" stroke="#526373" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)" /><path d="M548 324H863" fill="none" stroke="#526373" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)" /><text x="705" y="366" font-size="30" fill="#526373" text-anchor="middle" >Result</text>
