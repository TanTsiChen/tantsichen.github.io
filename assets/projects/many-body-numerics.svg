<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title description">
  <title id="title">Simulating quantum many-body systems</title>
  <desc id="description">A general view of quantum many-body simulation. Coupled local degrees of freedom form an interacting lattice system. An arrow leads to its numerical representation, illustrated by a tensor network with virtual bonds and open physical indices. Simulation gives access to spectra, correlations, entanglement, and dynamics. The tensor network is one example of a numerical representation; the diagram does not prescribe a particular algorithm or model.</desc>

