<svg xmlns="http://www.w3.org/2000/svg" width="600" height="640" viewBox="0 0 600 640" role="img" aria-labelledby="title description">
  <title id="title">An LLM-assisted research loop spanning theory and experiment</title>
  <desc id="description">Knowledge and methods across fields feed into an LLM-assisted research loop. LLM agents ask and solve physics questions through theory, numerical work or experiments, then verify the results and refine the questions and methods.</desc>

  <defs>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#526373" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#3e69a0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#367c78" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-plum" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#88638e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#ac7c30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="600" height="640" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif" font-weight="400">
    <g transform="translate(0 20)" ><g transform="translate(300 47)" ><text x="0" y="0" font-size="32" fill="#293744" text-anchor="middle" >Knowledge</text><text x="0" y="37" font-size="32" fill="#526373" text-anchor="middle" >across fields</text><path d="M-63 60H-22" fill="none" stroke="#3e69a0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M-17 60H24" fill="none" stroke="#88638e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M29 60H70" fill="none" stroke="#367c78" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><path d="M300 120V146" fill="none" stroke="#526373" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)" /><g transform="translate(190 202)" ><text x="110" y="-23" font-size="32" fill="#3e69a0" text-anchor="middle" >LLM agents</text><rect x="0" y="0" width="220" height="94" rx="6" fill="#edf3f9" stroke="none" stroke-width="2"/><text x="110" y="58" font-size="32" fill="#293744" text-anchor="middle" >Ask &amp; solve</text></g><path d="M300 306V341" fill="none" stroke="#526373" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M300 341H157V370" fill="none" stroke="#3e69a0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)" /><path d="M300 341H450V370" fill="none" stroke="#367c78" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)" /><g transform="translate(39 385)" ><rect x="0" y="0" width="236" height="82" rx="5" fill="#edf3f9" stroke="none" stroke-width="2"/><text x="118" y="34" font-size="32" fill="#3e69a0" text-anchor="middle" >Theory &amp;</text><text x="118" y="69" font-size="32" fill="#3e69a0" text-anchor="middle" >numerics</text></g><g transform="translate(332 392)" ><rect x="0" y="0" width="236" height="68" rx="5" fill="#edf5f2" stroke="none" stroke-width="2"/><text x="118" y="46" font-size="32" fill="#367c78" text-anchor="middle" >Experiments</text></g><path d="M157 481V507H450V474" fill="none" stroke="#526373" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M157 507H28V249H175" fill="none" stroke="#526373" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)" /><text x="300" y="553" font-size="32" fill="#526373" text-anchor="middle" >Verify &amp; refine</text></g>
  </g>
</svg>
