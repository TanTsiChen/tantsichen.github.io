<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title description">
  <title id="title">Folding and unfolding between conformal interfaces and boundaries</title>
  <desc id="description">An interface joins CFT 1 and CFT 2. Folding the second theory onto the first turns the interface into a conformal boundary of the product theory CFT 1 times orientation-reversed CFT 2. A second arrow labeled Unfolding points back from the boundary to the interface. Blue and green sheets represent the two theories; hatching marks the physical boundary in the folded description.</desc>

